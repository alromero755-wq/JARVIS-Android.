name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract JARVIS project ZIP
        run: |
          test -f JARVIS_Android_con_compilacion_APK.zip
          mkdir source
          unzip -q JARVIS_Android_con_compilacion_APK.zip -d source
      - name: Build debug APK
        working-directory: source
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
